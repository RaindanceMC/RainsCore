name: RainsCore
version: '${project.version}'
main: de.raindancer.core.RainsCorePlugin
bootstrapper: de.raindancer.core.RainsCoreBootstrap
api-version: '26.3'
folia-supported: true
description: The one implementation of everything Rain's plugins do to the game.
author: Raindancer118
website: https://github.com/Raindancer118/RainsCore

# Deliberately no commands: block, and a bootstrapper that registers nothing. This is a library —
# taking a name like /warp on somebody's server is not its decision to make. The ready-made handlers
# live in de.raindancer.core.platform.command.CoreCommands and a plugin registers whichever it wants,
# including the callback command chat buttons need (a command only because a chat click has to be).
#
# The empty bootstrapper is required, not leftover: Paper's bootstrap phase has its own registry, and
# a plugin that declares no bootstrapper is not in it — so a dependent could not declare
# `dependencies.bootstrap: RainsCore` and would fail to load with "Unknown/missing dependency".

dependencies:
  server:
    # Optional, and only for the server phase: nothing registered at bootstrap sends a message, so
    # nothing there needs it on the classpath yet. required: false is the whole point — a server with
    # no PlaceholderAPI installed loads exactly as it did before this existed. load: BEFORE only takes
    # effect when the plugin is actually present, so it costs nothing when it is not.
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    # Same treatment. Grants picks a LuckPerms-backed store over its own file when this is present —
    # see Grants and LuckPermsGrantStore — and load: BEFORE is what lets it ask
    # LuckPermsProvider.get() during onEnable rather than racing LuckPerms' own startup.
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
    # Same treatment. With it, Economies offers a Rain economy to every Vault plugin and falls back to a
    # foreign Vault economy when none is installed — see VaultBridge.
    # The model engine Core installs itself (world.model.BundledEngine). Loaded first so its pack and API are there
    # when Core starts; a server without it yet (first start) loads as before.
    BetterModel:
      load: BEFORE
      required: false
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
