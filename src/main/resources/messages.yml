# ──────────────────────────────────────────────────────── questions typed into chat
# <problem> is what was wrong with the answer, <left> how many tries remain.
prompt:
  how: "<dark_gray>Type your answer in chat — or <white>cancel</white>. <seconds>s to answer."
  again: "<red><problem> <gray>Try again — <left> <tries> left."
  gave-up: "<red><problem> That was the last try; nothing was changed."
  timed-out: "<gray>No answer came, so nothing was changed. The silence was deafening."
  cancelled: "<gray>Cancelled — nothing was changed."
  busy: "<yellow>Something else is already waiting for your answer — answer or cancel that first."
  suggestions: "<dark_gray>Click one: "

# ─────────────────────────────────────────────────────────────────────────────
#  Nothing else here on purpose.
#
#  Core is a library: warps, votes, resource packs and achievements are things
#  it *manages*, not things it talks about. The sentences a player reads about
#  their own warp come from whichever plugin owns the command — and that plugin
#  registers its own wording, either in its own messages.yml or through
#  RainsCore.messages().define(...).
#
#  An earlier draft of this file had keys for all of them. They were removed:
#  a message file listing lines that never appear is worse than a short one,
#  because somebody translates them and then wonders why nothing changed.
# ─────────────────────────────────────────────────────────────────────────────

# ── vanish: saying something while hidden ────────────────────────────────────
vanish-chat:
  held: "<yellow>Psst — you're vanished. Saying <white><line></white> would tell everybody you're here."
  not-asking: "<gray>Sent. You will not be asked again until you reappear."
  kept: "<gray>Not sent."

# ─────────────────────────────────────────────── /prefix and its menu
prefix-design:
  which-mode: "<red>Either <white>shared</white> or <white>per-plugin</white>."
  no-style: "<red>No colour or decoration in that. Like <white>#ff8800,#ffee00|bold</white>."
  file-broken: "<red>prefix.yml is broken; the defaults are used until it is fixed. The console says where."
  # The change is in effect, it just will not survive a restart.
  changed-not-saved: "<yellow>Prefix changed, but prefix.yml could not be written — this lasts until the next restart or reload."
  not-saved: "<red>prefix.yml could not be written, so this lasts until the next restart or reload."

# ─────────────────────────────────────────────── editing a sound or particle cue
cues:
  not-a-sound: "<red>Nothing in that could be read as a sound, so nothing changed."
  not-a-particle: "<red>Nothing in that could be read as a particle, so nothing changed."
  busy: "<red>You are already being asked something else — answer or cancel that first."

# A player sent to another server of the network (2.0.0).
travel:
  failed: "<red>Could not reach <white><server></white> just now — you are still here."
  arrival-lost: "<yellow>You arrived, but the place you were sent to is not on this server any more."

friends:
  off: "<red>Friends need the network — this server is on its own."
  joined-network: "<green>●</green> <white><name></white> <gray>joined the network."
  now-playing: "<green>●</green> <white><name></white> <gray>is now playing <white><server></white><gray>."
  requests-waiting: "<gray>You have <white><count></white> friend request(s) waiting — <white>/friend requests</white>."
  sent: "<gray>Friend request sent to <white><name></white>."
  asked-you: "<white><name></white> <gray>wants to be your friend — <green>/friend accept <name></green> <gray>or <red>/friend deny <name></red>"
  accepted: "<green>You and <white><name></white> are friends now."
  now-friends: "<green><white><name></white> and you are friends now."
  denied: "<gray>You turned down <white><name></white>."
  removed: "<gray><white><name></white> is no longer on your friends list."
  already-friends: "<gray>You and <white><name></white> are friends already."
  already-asked: "<gray>You asked <white><name></white> already — they have not answered yet."
  no-request: "<red><white><name></white> has not asked to be your friend."
  not-friends: "<red><white><name></white> is not on your friends list."
  self: "<red>You are your own best friend already."
  too-many: "<red>That friends list is full (a hundred)."
  failed: "<red>That did not work — try again in a moment."
  unknown: "<red>Nobody called <white><name></white> has been on the network."
  not-online: "<red><white><name></white> is not online — or not your friend."
  list-empty: "<gray>No friends yet — <white>/friend add <name></white>."
  list-header: "<gold>Friends <gray>(<white><online></white> of <white><total></white> online)"
  list-online: " <green>●</green> <white><name></white> <gray>— <server> · <white>/friend join <name></white>"
  list-offline: " <dark_gray>○</dark_gray> <gray><name>"
  requests-empty: "<gray>No friend requests."
  requests-line: " <white><name></white> <gray>— <green>/friend accept <name></green> <gray>· <red>/friend deny <name></red>"
  usage: "<gray>/friend add|accept|deny|remove <name> · list · requests · join <name>"

party:
  off: "<red>Parties need the network — this server is on its own."
  invited: "<white><name></white> <gray>invited you to their party — <green>/party accept <name></green> <gray>(two minutes)"
  invite-sent: "<gray>Invited <white><name></white> — the invite lasts two minutes."
  joined: "<green>You are in <white><name></white>'s party now. <gray>Where they go, you go — <white>/pc</white> to talk."
  member-joined: "<light_purple>[Party]</light_purple> <white><name></white> <gray>joined."
  left: "<gray>You left the party."
  member-left: "<light_purple>[Party]</light_purple> <white><name></white> <gray>left."
  member-gone: "<light_purple>[Party]</light_purple> <white><name></white> <gray>left the network and the party."
  kicked: "<gray><white><name></white> is out of the party."
  you-were-kicked: "<red>You were removed from the party."
  following: "<light_purple>[Party]</light_purple> <gray>Following your leader…"
  chat: "<light_purple>[Party]</light_purple> <white><name></white><gray>: <message>"
  none: "<gray>You are in no party — <white>/party invite <name></white> starts one."
  none-but-invited: "<gray>You are in no party. Invited by: <white><names></white> — <white>/party accept <name></white>"
  list-header: "<light_purple>Party <gray>(<white><count></white>/<most>)"
  list-leader: " <gold>★</gold> <white><name></white> <gray>— <server>"
  list-line: " <light_purple>●</light_purple> <white><name></white> <gray>— <server>"
  not-leader: "<red>Only the party's leader does that."
  not-in-one: "<red>You are not in a party — or they are not in yours."
  already-in-one: "<red>Already in a party."
  no-invite: "<red>No invite from <white><name></white> — or it ran out."
  full: "<red>The party is full (eight)."
  self: "<red>That is you."
  failed: "<red>That did not work — try again in a moment."
  not-online: "<red><white><name></white> is not online."
  usage: "<gray>/party invite|accept|kick <name> · leave · list · chat <message> · /pc <message>"
