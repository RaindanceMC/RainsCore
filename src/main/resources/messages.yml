# ─────────────────────────────────────────────────────────────────────────────
#  Rain's Core — every word a player sees.
#
#  Edit any line here and that line is what players get. A line you delete, or
#  a key a newer version added and this file has not got, falls back to the
#  wording built into the jar — so an old file never blanks out a message, it
#  just stops customising it.
#
#  Your edits are never overwritten. This file is written once, on the first
#  start, and left alone from then on.
#
#  FORMATTING is MiniMessage: <red>text</red>, <bold>, <gradient:gold:yellow>.
#  See https://docs.advntr.dev/minimessage/format.html
#
#  PLACEHOLDERS are the <angled> names in each line. They are filled in with
#  real values, and anything a player typed — a name, a reason, a home's title
#  — is inserted as plain text. A player called <rainbow> cannot recolour your
#  messages. Placeholders you delete simply do not appear; ones you invent are
#  left as they are, which is usually a typo in the name.
#
#  A COLOUR NAME WITH A TYPO in it will not break anything: the message still
#  arrives, without its markup, and the mistake is written to the log. The
#  times these messages matter most are the times somebody is being refused.
# ─────────────────────────────────────────────────────────────────────────────

# In front of most messages Core sends. Set it to "" for no prefix at all.
prefix: "<gray>[<aqua>Core<gray>] "

# ─────────────────────────────────────────── punishments: what a player is told
punishment:

  # The full screen a banned player sees instead of joining. \n is a new line.
  banned:
    heading: "<red><bold>You are banned from this server.</bold>"
    # <reason> is what the moderator typed.
    reason: "<gray><reason>"
    permanent: "<dark_gray>This ban does not expire."
    # <time> reads like "2 days, 4 hours".
    temporary: "<dark_gray>Time left: <time>"

  # One line in chat when a muted player tries to talk.
  # <reason> is the moderator's; <time> only appears in the temporary version.
  muted: "<red>You are muted: <gray><reason>"
  muted-temporary: "<red>You are muted: <gray><reason> <dark_gray>(<time> left)"

  # And when a frozen player tries to build.
  frozen: "<red>You cannot build right now: <gray><reason>"
  frozen-temporary: "<red>You cannot build right now: <gray><reason> <dark_gray>(<time> left)"

  # Shown under the ban reason, if the owner set an appeal address in the
  # settings. Left out entirely when they have not.
  appeal: "<gray><message>"

  # How a length is written out. <count> is the number.
  length:
    forever: "for ever"
    days: "<count> days"
    hours: "<count> hours"
    minutes: "<count> minutes"
    seconds: "<count> seconds"

# ────────────────────────────────────────────────────── clickable chat buttons
button:
  not-yours: "<red>That is not your button."
  already-answered: "<yellow>You have already answered that."
  no-longer-offered: "<yellow>That offer has expired. Gone, like free diamonds."
  failed: "<red>That did not work. The server has written down why."
  not-a-player: "<red>Only a player can click a button."
  not-typed: "<yellow>That is not something to type."

# ──────────────────────────────────────────────────── a command nobody has
command:
  # <command> is what was typed. Only said when something close exists; otherwise the server's own line.
  unknown: "<red>/<command> is not a thing here. Not even a secret thing."
  # A command that exists, with a word after it that it does not know. <word> is that word.
  unknown-sub: "<red>/<command> does not do <word>. It has a short list, and that is not on it."
  # The guesses follow as buttons, then did-you-mean-end.
  did-you-mean: "<gray>Did you mean "
  did-you-mean-end: "<gray>?"

# ─────────────────────────────────────────────────────────── the settings menu
settings:
  # <name> is the setting, <value> what it became.
  changed: "<green><name> is now <value>. Done and dusted."
  # /settings reset <name>: back to the default, which is <value>.
  reset: "<green><name> is back to <value>."
  refused: "<red><value> is not something <name> can be."
  finish-first: "<gray>Finish what you were asked first."
  gone: "<gray>That setting is not there any more."
  # A change that is in effect but could not be written, because the file has a mistake in it.
  not-saved: "<yellow>Changed for now, but <file> could not be saved — it has a mistake in it (the console says where). Fix it and the next change is kept; until then a restart undoes this."
  # /settings <name> for a name nothing has. <name> is what was typed.
  unknown: "<red>Nothing on this server is called <name>."
  did-you-mean: "<gray>Did you mean "
  look-for-it: "<gray>Or look for it with <white>/settings search</white> and a word."
  # Searching the settings. <query> is what was searched for.
  search-title: "Search the settings"
  search-none: "<gray>No setting mentions <query>. Try a shorter word."
  search-found: "<gray><count> settings mention <query>:"

# ─────────────────────────────────────── the chat log, and telling players it exists
chatlog:
  notice: "<dark_gray>Chat on this server is kept for <days> days so staff can look into reports. Private messages are not kept."

# ─────────────────────────────────────── looking inside somebody's inventory
invsee:
  # What a moderator is told when opening one does not work.
  opened: "<gray>Looking inside <who>."
  yourself: "<gray>Your own inventory is a key rather than a menu. Check your pockets instead."
  being-edited: "<yellow>Somebody else is editing that inventory."
  never-seen: "<red>This server has never seen that player."
  unreadable: "<red>Their inventory could not be read — the log says why."
  not-allowed: "<red>You may not do that."
  switched-off: "<red>Looking inside inventories is switched off on this server."

  # When an offline edit could not be saved. Nothing was changed either way.
  not-saved: "<red>Their inventory was not saved — nothing was changed, and what you added is back with you."
  # When its owner logged in before the window was closed. The player wins.
  owner-returned: "<gold><who> logged in before you closed the window, so your changes were not saved — their file is untouched. Open their inventory again to change it live."
  # Said to anybody else who was watching when that happened.
  owner-returned-watcher: "<gray>They just logged in — the window was showing their saved file, which is no longer where their things are. Open it again to see them live."

  # The window's own title: <who> is whose inventory, <access> what you may do.
  title: "<who> — <access>"

  # What a watcher is allowed to do, as it appears in the title.
  access:
    read-only: "Looking"
    edit: "Editing"
    edit-everything: "Editing everything"

  # The parts of an inventory, as the window labels them.
  section:
    hotbar: "Hotbar"
    storage: "Backpack"
    armour: "Worn"
    off-hand: "Off Hand"
    ender-chest: "Ender Chest"

  # Armour, named from the head down.
  armour:
    helmet: "Helmet"
    chestplate: "Chestplate"
    leggings: "Leggings"
    boots: "Boots"
    other: "Worn"

  # The two buttons on the window.
  ender-chest-button:
    name: "Ender Chest"
    # <used> of <total> slots have something in them.
    lore: "Their ender chest — <used> of <total> used"
    hint: "Click to look inside"
  back-button:
    name: "Back"
    lore: "What <who> is carrying"
    hint: "Click to go back"

# ──────────────────────────────────────────── attendants standing in the world
desk:
  # <desk>: what the attendant is called, e.g. Insurance agent.
  in-person-only: "<red>That is done in person here. <gray>Go and see an <white><desk></white> — they do not take calls."

# ──────────────────────────────────────────────────────── menus, everywhere
menu:
  back: "<gray>Back"
  back-to: "<gray>Back to <where>"
  home: "<gray>Main menu"
  close: "<gray>Close"
  close-lore: "<gray>Shut this menu. It will not be offended"
  help: "<aqua>What is this?"
  # A button somebody may not use is shown greyed with the reason.
  locked: "<dark_gray><reason>"
  previous-page: "<gray>Previous page"
  next-page: "<gray>Next page"
  # <page> of <pages>.
  page-of: "<dark_gray>Page <page> of <pages>"
  previous-menu: "the previous menu"

# ────────────────────────────────────────────────────── who may hurt whom
combat:
  # Told to the attacker, at most once every few seconds. The person being
  # protected is not told anything: they did not do anything.
  no-pvp: "<red>Players cannot hurt each other here."
  no-pve: "<red>Fighting creatures is off here."
  # When something else refused — a claim, an arena. Deliberately vague,
  # because Core does not know which plugin said no or why.
  protected: "<red>Something is protecting that."
  # A rule that allows this fight with bare fists only. A plugin can say this its own way.
  fists-only: "<red>Only fists here — put down what you are holding."

navigation:
  # world.visual.Navigator — walking somebody to a point. A plugin can say these its own way.
  started: "<green>Navigating to <white><target></white>. Follow the trail."
  distance: "<yellow><target> <gray>— <white><blocks></white> blocks"
  other-world: "<yellow><target> <gray>is in another world."
  arrived: "<green>You have reached <white><target></white>. Ta-da."

# ─────────────────────────────────────────────────────────── custom items
#
#  Said when a custom item was clicked and did not do its thing. There is no
#  line for the case where it worked: the item itself is the message, and a
#  chat line saying "you used the smoke bomb" on top of a cloud of smoke is
#  noise. A miss — a grappling hook aimed at the sky — is also silent, and
#  deliberately: it costs nothing, so it should read as a miss rather than as
#  a refusal.
items:
  not-for-spawners: "<red>Nice try. Eggs from the shop hatch mobs — they don't set spawners."
  cooling-down: "<yellow><item> is not ready yet — <white><seconds>s</white>."
  used-up: "<yellow><item> has nothing left in it."
  # The ability threw. The reason is in the log with its stack trace; the
  # player gets a sentence rather than an item that silently does nothing.
  went-wrong: "<red><item> did not work. Somebody should look at the log."
  # Saving an empty crafting grid in /items. <item> is the item's id.
  no-recipe: "<yellow><item> has no recipe any more."

# ─────────────────────────────────────────────────────────────── the tablist
tablist:
  nobody-on: "<dark_gray>nobody is on. Very exclusive."

# ─────────────────────────────────────────────── world protection: land
#
#  Neutral on purpose. Core protects "an area"; it does not know whether the
#  area is a claim, an arena, a plot or a spawn region. Whichever plugin owns
#  the ground reads better than this and should say so —
#
#      messages.define("land.flag.pvp.description",
#              "Players may damage each other inside this claim");
#
#  A `define` sits below this file, so a server owner's own edit still wins.
land:
  # Said on the action bar when somebody is refused. Throttled to once every
  # second and a half, because holding a mouse button down produces one of
  # these per tick.
  denied: "<red>You may not <white><permission></white> in <white><claim></white>."
  pvp-refused: "<red>Fighting is not allowed in <white><claim></white>."
  potions-refused: "<red>Potions are not allowed in <white><claim></white>."
  redstone-refused: "<red>Redstone does not work in <white><claim></white>. The wiring is on strike."
  riptide-refused: "<red>Riptide is not allowed in <white><claim></white>. No flying trident tours here."
  leads-refused: "<red>You may not lead animals about in <white><claim></white>."
  boats-refused: "<red>Boats and minecarts may not be put down in <white><claim></white>."
  walk-in-refused: "<red>You may not go into <white><claim></white>. The door is metaphorical, the no is not."
  hit-mobs-refused: "<red>You may not hurt the animals in <white><claim></white>."
  hit-monsters-refused: "<red>You may not fight monsters in <white><claim></white>."
  interact-mobs-refused: "<red>You may not handle the animals in <white><claim></white>."

  bypass-reminder: "<gold>Your protection bypass has been on for a while. <gray>Still need your superpowers?"
  bypass-reminder-extended: "<gray>Alright — asked again in ten minutes."
  bypass-reminder-silenced: "<gray>Won't ask again until you toggle bypass off and back on."

  audience:
    owner:
      name: "Owners"
      description: "Whoever is responsible for this ground"
    trusted:
      name: "Trusted"
      description: "People who have been given a say here"
    visitor:
      name: "Visitors"
      description: "Everybody else"

  flag-group:
