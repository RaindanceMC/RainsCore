# ─────────────────────────────────────────────────────────────────────────────
#  Rain's Core — the serious wording.
#
#  Used instead of messages.yml when the Message tone setting is SERIOUS: the same
#  keys, said plainly, without the remark after a refusal. Only lines that differ
#  are here; every other key keeps its one wording in both tones.
#
#  A line you changed in plugins/RainsCore/messages.yml wins in both tones. To
#  reword one of these, put it in that file.
# ─────────────────────────────────────────────────────────────────────────────

button:
  no-longer-offered: "<yellow>That is no longer on offer."

command:
  unknown: "<red>There is no command /<command>."
  unknown-sub: "<red>/<command> has no option <word>."

settings:
  changed: "<green><name> is now <value>."

invsee:
  yourself: "<gray>Your own inventory is a key rather than a menu."

desk:
  in-person-only: "<red>This is only arranged in person. <gray>Please see an <white><desk></white>."

menu:
  close-lore: "<gray>Shut this menu"

navigation:
  arrived: "<green>You have reached <white><target></white>."

tablist:
  nobody-on: "<dark_gray>nobody is on"

land:
  redstone-refused: "<red>Redstone does not work in <white><claim></white>."
  riptide-refused: "<red>Riptide is not allowed in <white><claim></white>."
  walk-in-refused: "<red>You may not go into <white><claim></white>."
  bypass-reminder: "<gold>Your protection bypass has been on for a while. <gray>Still working?"

prompt:
  timed-out: "<gray>No answer came, so nothing was changed."

vanish-chat:
  held: "<yellow>You are vanished. Saying <white><line></white> would show everybody that you are here."

items:
  not-for-spawners: "<red>Spawn eggs from the shop cannot be used on spawners."

help:
  greeting:
    - "Welcome, <white><player></white>. How can I help?"
    - "Welcome to <white><server></white>. What would you like to know?"
  greeting-hint: "<gray>Choose a subject below, or type a question into the box. There are <white><topics></white> subjects here."
  search-nothing: "<gray>Nothing matches <white><asked></white>. Try other or fewer words."
  switched-off: "<gray><white><title></white> is not available on this server."
  search-empty: "<gray>Type a question into the box first."
  generated-note: "<dark_gray><i>There is no written guide for this feature yet; this is what it reports about itself.</i>"
  new-player: "<gray>New here? Type <white><click:run_command:'/help'><hover:show_text:'<gray>Click to ask'>/help</hover></click></white> or talk to <white><guide></white> at spawn."
